[project]
name = "dartmouth-places"
version = "0.1.0"
description = "A FastAPI reference app for sharing useful or interesting places around campus."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi[standard]>=0.110",
    "uvicorn[standard]>=0.29",
    "sqlmodel>=0.0.16",
]


[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]


